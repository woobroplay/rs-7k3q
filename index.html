<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우브로 레퍼런스 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#fbf7f1;--card:#fff;--ink:#2b2622;--sub:#8a7f76;--line:#eee5da;--pink:#ff6f91;--pinkbg:#ffeef2;--yel:#ffd36b;--teal:#2bb5a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR',sans-serif}
header{padding:22px 28px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:24px;font-weight:800}h1 span{color:var(--pink)}
.upd{color:var(--sub);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 28px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{opacity:.6;font-weight:500;margin-left:4px}
.sp{flex:1}
select,input[type=search]{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
input[type=search]{width:190px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pinkbg);border-color:var(--pink);color:#c2335a;font-weight:700}
main{padding:20px 28px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(60,40,20,.08);display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,40,20,.12)}
.th{position:relative;aspect-ratio:3/4;background:#eee center/cover no-repeat;cursor:pointer}
.th.yt{aspect-ratio:16/10}
.rank{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:3px 8px}
.views{position:absolute;left:10px;bottom:10px;background:var(--yel);color:#2b2622;font-weight:800;font-size:15px;border-radius:9px;padding:4px 10px}
.views small{font-weight:600;font-size:11px}
.star{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:18px;cursor:pointer;color:#c9bfb5}
.star.on{color:var(--pink)}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:#f3eee8;color:#6d635b}
.tag.k{background:#fff1d6;color:#a86b00}.tag.o{background:#e3f6f3;color:#16786c}.tag.g{background:var(--pinkbg);color:#c2335a}.tag.hot{background:#ff6f91;color:#fff}
.acc{font-size:13px;font-weight:700}.acc a{color:inherit;text-decoration:none}
.ttl{font-size:14.5px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.prod{font-size:13px;color:#c2335a;font-weight:700}
.meta{font-size:12.5px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 0;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.box{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:88vh;overflow:auto;display:grid;grid-template-columns:260px 1fr}
.box .im{background:#eee center/cover no-repeat;min-height:340px}
.box .tx{padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:18px}
.cap{white-space:pre-wrap;font-size:14px;line-height:1.6;background:#faf6f0;border-radius:10px;padding:12px;max-height:200px;overflow:auto}
.an{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
.an b{color:#c2335a}
.x{position:absolute;top:18px;right:22px;font-size:26px;color:#fff;cursor:pointer;background:none;border:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.credit{text-align:center;color:var(--sub);font-size:12px;padding-bottom:20px}
@media(max-width:640px){.box{grid-template-columns:1fr}.box .im{min-height:260px}header,.bar,main{padding-left:14px;padding-right:14px}}
.tag.ai{background:#e6eeff;color:#2b5fd6}.tag.hot2{background:#ffe8e0;color:#d9480f}.tag.lamp{background:#f6ecd8;color:#8a5a00}
.tag.st{background:#2b2622;color:#fff}
.board{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:#f3ece3;border-radius:16px;padding:12px;min-height:200px}
.col h4{margin:2px 4px 10px;font-size:15px;display:flex;justify-content:space-between}
.col h4 span{color:var(--sub);font-weight:600}
.mini{background:#fff;border-radius:12px;display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px;margin-bottom:8px;box-shadow:0 1px 2px rgba(60,40,20,.08)}
.mini .mt{width:64px;height:80px;border-radius:8px;background:#eee center/cover;cursor:pointer}
.mini .mb{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini .mb .a{font-size:12.5px;font-weight:700}.mini .mb .t{font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini .mv{display:flex;gap:4px;margin-top:auto}.mini .mv button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;padding:4px 0;cursor:pointer}
.box.wide{max-width:1000px;grid-template-columns:240px minmax(0,1fr);overflow-x:hidden}.box .tx{min-width:0}
.frames{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.frames div{flex:0 0 auto;text-align:center;font-size:11px;color:var(--sub)}.frames img{height:150px;border-radius:8px;display:block;margin-bottom:2px}
.an h5{margin:10px 0 4px;font-size:14px;color:#c2335a}.an ol,.an ul{margin:0;padding-left:20px}.an .idea{background:#fff7e6;border-radius:10px;padding:8px 10px;margin:6px 0}
.dates{display:flex;gap:6px;flex-wrap:wrap;padding:10px 28px 0;align-items:center}.dates b{font-size:13px;color:var(--sub);margin-right:4px}.dchip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:600}.dchip.on{background:var(--teal);border-color:var(--teal);color:#fff}.dchip span{opacity:.65;font-weight:500;margin-left:3px}
.dhead{grid-column:1/-1;font-size:16px;font-weight:800;margin:6px 0 -4px;color:var(--ink);border-bottom:2px solid var(--line);padding-bottom:6px}
.stg{display:flex;gap:6px;flex-wrap:wrap}.stg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}.stg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:800px){.board{grid-template-columns:1fr}}.tag.mine{background:#efe6ff;color:#6b3fd6}.top3{grid-column:1/-1;background:#fff8e6;border:2px solid #f3d27a;border-radius:16px;padding:14px 16px}.top3 h3{margin:0 0 10px;font-size:17px}.t3{display:flex;gap:12px;align-items:flex-start;padding:8px 4px;border-top:1px dashed #ead9a8;cursor:pointer}.t3:first-of-type{border-top:0}.t3>b{background:#f3b400;color:#fff;border-radius:50%;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center}.t3a{font-weight:800;font-size:14px}.t3w{font-size:13px;color:#4a423b;margin-top:2px}.t3f,.fit{font-size:13px;color:#2f6f3e;font-weight:700;margin-top:3px}.vd{display:inline-block;font-weight:800;font-size:13px;border-radius:8px;padding:3px 9px;margin-bottom:6px}.vok{background:#e3f6e8;color:#1f7a3a}.vref{background:#fff1d6;color:#9a6400}.vno{background:#fde4e4;color:#b42323}.why{font-size:13px;color:#4a423b;margin:4px 0 2px;line-height:1.45}.tag.info{background:#fff1d6;color:#9a6400}
.tag.sj{background:#e3f6e8;color:#1f7a3a}.tag.cp{background:#ffe9d6;color:#c2410c}.btn.cpb{background:#fff3e8;color:#c2410c;border-color:#f7c9a3}.cpk{font-size:12px;font-weight:800;color:#c2410c}.cpchips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.cpt .sub{font-size:12.5px;color:#8a6d3b;margin:-4px 0 8px;line-height:1.5}.tag.fun{background:#fde4e4;color:#b42323}
.sjb{background:#f8f5ef;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;gap:4px}.sjb b{font-weight:800}.sjb .cl{color:#6d635b}.sjb .ck{color:#2b2622}.sjb .ck.cut{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sjm{display:flex;gap:5px;flex-wrap:wrap}.sjm span{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.stars{color:#f3b400;font-size:13px;letter-spacing:1px}.stars i{color:#e2d9cf;font-style:normal}
.sjt{grid-column:1/-1;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(60,40,20,.08)}.sjt h3{margin:0 0 4px;font-size:17px}.sjt .sub{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.sjr{display:grid;grid-template-columns:120px 1.1fr 1.6fr 1fr;gap:10px;padding:8px 2px;border-top:1px dashed var(--line);font-size:13px;line-height:1.45;align-items:start}.sjr .j{font-weight:800}.sjr .e{color:#6d635b}.sjr .f{color:#2f6f3e;font-weight:700}
@media(max-width:800px){.sjr{grid-template-columns:1fr}}</style></head><body>
<header><div><h1>우브로 <span>레퍼런스</span> 스튜디오</h1><div class="upd" id="upd"></div></div></header>
<div class="bar">
 <div class="tabs" id="tabs"></div><div class="sp"></div>
 <button class="chip" data-pf="인스타">인스타</button><button class="chip" data-pf="유튜브">유튜브</button>
 <select id="sort"><option value="views">조회수 높은 순</option><option value="speed">떡상 속도 순 (하루 평균)</option><option value="new">최신 게시 순</option><option value="comments">댓글 많은 순</option><option value="ratio">팔로워·구독자 대비 배수 순</option></select>
 <input type="search" id="q" placeholder="검색 (계정, 문구, 상품)">
</div>
<div class="dates" id="dates"></div>
<main id="grid"></main>
<div class="credit">국내 바이럴 · 해외 아이디어 · 공구 트렌드 · 떡상 조사 · AI 유튜브 · 등불사연 · 부업 검증 · 쿠팡 영상 루틴이 모은 레퍼런스 · 조회수는 Apify로 확인</div>
<div class="modal" id="modal"><button class="x" onclick="closeM()">×</button><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>
<script src="refs_data.js"></script>
<script src="refs_analysis.js" onerror="window.ANALYSIS=window.ANALYSIS||{}"></script>
<script src="sidejob_types.js" onerror="window.SJTYPES={types:[]}"></script>
<script>
const R=window.REFS||[];window.ANALYSIS=window.ANALYSIS||{};
const SRC=['전체','국내 바이럴','해외 아이디어','공구 트렌드','떡상 조사','AI 유튜브','등불사연','보내준 레퍼런스','정보 추천','부업 검증','쿠팡 영상','찜','보드'];
const CPC=['전체','만들기','미술놀이','휴대용놀이','유아간식','놀이템'];let cpc='전체';
const cpUrl=r=>'https://www.coupang.com/np/search?q='+encodeURIComponent(r.cpq||r.product||'');
function cpTop(){const top=R.filter(r=>r.src==='쿠팡 영상'&&r.cpick).sort((a,b)=>a.cpick-b.cpick).slice(0,5);
 return '<div class="top3 cpt"><h3>🛒 쿠팡 파트너스로 바로 찍기 좋은 TOP 5</h3><div class="sub">만들기·미술놀이·휴대용놀이·유아간식 중 반응 좋고 쿠팡 링크로 연결하기 쉬운 것 · 영상엔 "쿠팡 파트너스 활동으로 수수료를 받을 수 있어요" 문구 꼭 넣기 · 실제로 사서 써 본 것만 소개</div>'+top.map(r=>'<div class="t3" onclick="openM(\''+r.id+'\')"><b>'+r.cpick+'</b><div><div class="t3a">'+esc(r.cat)+' · '+(r.platform==='인스타'?'@':'')+esc(r.account)+' · '+fmt(r.views)+'회</div><div class="t3w">'+esc(r.product)+'</div><div class="t3f">👉 '+esc(r.fit||'')+'</div></div></div>').join('')+'</div>'+
 '<div class="cpchips">'+CPC.map(c=>{const n=c==='전체'?R.filter(r=>r.src==='쿠팡 영상').length:R.filter(r=>r.src==='쿠팡 영상'&&r.cat===c).length;return '<button class="dchip'+(cpc===c?' on':'')+'" onclick="cpc=\''+c+'\';render()">'+c+'<span>'+n+'</span></button>'}).join('')+'</div>'}
let tab='전체',pf=new Set(),stars=new Set(JSON.parse(localStorage.getItem('refStars')||'[]'));
let stage=JSON.parse(localStorage.getItem('refStage')||'{}');
let dsel='전체';
const inTab=r=>tab==='찜'?stars.has(r.id):tab==='정보 추천'?!!r.verdict:r.src===tab;
const SV={ok:['✅ 해볼 만함','vok'],ref:['△ 조건부·참고만','vref'],no:['❌ 비추','vno']};
function sjCard(r,full){if(!r.sv)return '';const st='<span class="stars">'+'★'.repeat(r.score||0)+'<i>'+'★'.repeat(5-(r.score||0))+'</i></span>';return '<div class="vd '+SV[r.sv][1]+'">'+SV[r.sv][0]+'</div><div class="sjb"><div class="cl"><b>📢 영상 주장</b> '+esc(r.claim||'')+'</div><div class="ck'+(full?'':' cut')+'"><b>🔎 검증</b> '+esc(r.check||'')+'</div><div class="sjm"><span>💰 비용 '+esc(r.cost||'-')+'</span><span>⏱ '+esc(r.time||'-')+'</span><span>⚠️ 위험 '+esc(r.risk||'-')+'</span></div><div class="fit">👉 '+esc(r.fit||'')+'</div><div>윤우맘 적합도 '+st+'</div></div>'}
function sjTop(){const T=(window.SJTYPES||{}).types||[];const top=R.filter(r=>r.src==='부업 검증'&&r.spick).sort((a,b)=>a.spick-b.spick).slice(0,3);
 return (top.length?'<div class="top3"><h3>💸 윤우맘이 해볼 만한 부업 TOP 3</h3>'+top.map(r=>'<div class="t3" onclick="openM(\''+r.id+'\')"><b>'+r.spick+'</b><div><div class="t3a">'+esc(r.cat)+' · '+(r.platform==='인스타'?'@':'')+esc(r.account)+'</div><div class="t3w">'+esc(r.check||'')+'</div><div class="t3f">👉 '+esc(r.fit||'')+'</div></div></div>').join('')+'</div>':'')+
 (T.length?'<div class="sjt"><h3>📋 부업 종류별 판정표</h3><div class="sub">유튜브·인스타에서 "이거 하면 돈 된다"는 부업들을 근거 자료로 확인한 결론 · '+esc(window.SJTYPES.updated||'')+'</div>'+T.map(t=>'<div class="sjr"><div><span class="vd '+SV[t.sv][1]+'">'+SV[t.sv][0]+'</span></div><div class="j">'+esc(t.job)+'<div style="font-weight:500;color:#4a423b;margin-top:2px">'+esc(t.line)+'</div></div><div class="e">🔎 '+esc(t.ev)+'</div><div class="f">👉 '+esc(t.fit)+'</div></div>').join('')+'</div>':'')}
const VD={ok:['✅ 할 만함','vok'],ref:['△ 참고만','vref'],no:['❌ 광고·과장','vno']};
const DOW=['일','월','화','수','목','금','토'];
const dLabel=d=>{if(!d)return '날짜 없음';const t=new Date(d+'T00:00:00');return (t.getMonth()+1)+'/'+t.getDate()+'('+DOW[t.getDay()]+')'};
function renderDates(){const el=document.getElementById('dates');if(tab==='보드'){el.innerHTML='';return}const base=R.filter(r=>tab==='전체'||inTab(r));const cnt={};base.forEach(r=>{const k=r.found||'';cnt[k]=(cnt[k]||0)+1});const ks=Object.keys(cnt).sort().reverse();
 el.innerHTML='<b>모은 날짜</b><button class="dchip'+(dsel==='전체'?' on':'')+'" data-d="전체">전체<span>'+base.length+'</span></button><button class="dchip'+(dsel==='날짜별'?' on':'')+'" data-d="날짜별">📅 날짜별로 묶어보기</button>'+ks.map(k=>'<button class="dchip'+(dsel===k?' on':'')+'" data-d="'+k+'">'+dLabel(k)+'<span>'+cnt[k]+'</span></button>').join('');
 el.querySelectorAll('.dchip').forEach(b=>b.onclick=()=>{dsel=b.dataset.d;render()})}
const STG=[['todo','💡 찍어볼 것'],['shot','🎬 촬영 완료'],['done','✅ 올림']];
const stName=s=>(STG.find(x=>x[0]===s)||[])[1]||'';
function setSt(id,s){if(!s||stage[id]===s)delete stage[id];else stage[id]=s;localStorage.setItem('refStage',JSON.stringify(stage));render();if(document.getElementById('modal').classList.contains('on'))openM(id);toast(s&&stage[id]?stName(s)+'에 담았어요':'보드에서 뺐어요')}
function mv(id,d){const i=STG.findIndex(x=>x[0]===stage[id]);const j=i+d;if(j<0){setSt(id,null);return}if(j>=STG.length)return;stage[id]=STG[j][0];localStorage.setItem('refStage',JSON.stringify(stage));render()}
const fmt=n=>n==null?'-':n>=1e8?(n/1e8).toFixed(1).replace('.0','')+'억':n>=1e4?(n>=1e5?Math.round(n/1e4):(n/1e4).toFixed(1).replace('.0',''))+'만':n.toLocaleString();
const today=new Date();const daysAgo=d=>d?Math.max(1,Math.round((today-new Date(d))/864e5)):null;
const ago=d=>{const n=daysAgo(d);return n==null?'':n<=1?'오늘·어제':n<31?n+'일 전':Math.round(n/30)+'달 전'};
const speed=r=>r.views&&r.posted?r.views/daysAgo(r.posted):0;
const tcls={'국내 바이럴':'k','해외 아이디어':'o','공구 트렌드':'g','AI 유튜브':'ai','떡상 조사':'hot2','보내준 레퍼런스':'mine','정보 추천':'info','등불사연':'lamp','부업 검증':'sj','쿠팡 영상':'cp'};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function first(r){return (r.title||r.caption||'').split('\n').find(l=>l.trim())||''}
document.getElementById('upd').textContent='마지막 업데이트 '+new Date(window.REFS_META?.updated||Date.now()).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+' · 레퍼런스 '+R.length+'개';
function renderTabs(){document.getElementById('tabs').innerHTML=SRC.map(s=>{const n=s==='전체'?R.length:s==='찜'?stars.size:s==='보드'?Object.keys(stage).filter(k=>R.some(r=>r.id===k)).length:(s==='정보 추천'?R.filter(r=>r.verdict).length:R.filter(r=>r.src===s).length);return '<button class="tab'+(s===tab?' on':'')+'" data-t="'+s+'">'+(s==='찜'?'★ 찜':s==='보드'?'📋 진행 보드':s)+'<span class="n">'+n+'</span></button>'}).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function list(){const q=document.getElementById('q').value.trim().toLowerCase(),so=document.getElementById('sort').value;
 let a=R.filter(r=>(tab==='전체'||inTab(r))&&(dsel==='전체'||dsel==='날짜별'||(r.found||'')===dsel)&&(!pf.size||pf.has(r.platform))&&(!q||[r.account,r.caption,r.title,r.product,r.cat].join(' ').toLowerCase().includes(q))&&(tab!=='쿠팡 영상'||cpc==='전체'||r.cat===cpc));
 const f={views:r=>r.views||0,speed,new:r=>+new Date(r.posted||0),comments:r=>r.comments||0,ratio:r=>r.ratio||0}[so];return a.sort((x,y)=>f(y)-f(x))}
function renderBoard(g){g.innerHTML='<div class="board">'+STG.map(([k,nm],ci)=>{const items=R.filter(r=>stage[r.id]===k);return '<div class="col"><h4>'+nm+'<span>'+items.length+'</span></h4>'+(items.length?items.map(r=>'<div class="mini"><div class="mt" style="background-image:url('+r.img+')" onclick="openM(\''+r.id+'\')"></div><div class="mb"><div class="a">'+(r.platform==='인스타'?'@':'')+esc(r.account)+' · '+fmt(r.views)+'회'+(ANALYSIS[r.id]?' · 분석완료':'')+'</div><div class="t">'+esc(first(r))+'</div><div class="mv"><button onclick="mv(\''+r.id+'\',-1)">'+(ci===0?'빼기':'◀')+'</button>'+(ci<2?'<button onclick="mv(\''+r.id+'\',1)">▶ '+STG[ci+1][1].slice(2)+'</button>':'')+'<button onclick="openM(\''+r.id+'\')">보기</button></div></div></div>').join(''):'<div style="color:#8a7f76;font-size:13px;padding:10px 4px">'+(ci===0?'카드의 "📋 담기"를 누르면 여기로 와요':'비어 있어요')+'</div>')+'</div>'}).join('')+'</div>'}
function render(){renderTabs();renderDates();const g=document.getElementById('grid');if(tab==='보드'){renderBoard(g);return}let a=list();if(tab==='부업 검증'){const o={ok:0,ref:1,no:2};a=a.slice().sort((x,y)=>(o[x.sv]-o[y.sv])||((x.spick||9)-(y.spick||9))||((y.score||0)-(x.score||0))||((y.views||0)-(x.views||0)))}if(tab==='정보 추천'){const o={ok:0,ref:1,no:2};a=a.slice().sort((x,y)=>(o[x.verdict]-o[y.verdict])||((x.pick||9)-(y.pick||9))||(+new Date(y.found||0)-+new Date(x.found||0)))}if(tab==='쿠팡 영상'&&document.getElementById('sort').value==='views'){a=a.slice().sort((x,y)=>((x.cpick||99)-(y.cpick||99))||((y.views||0)-(x.views||0)))}if(dsel==='날짜별'){a=a.slice().sort((x,y)=>(y.found||'').localeCompare(x.found||''))}
 if(!a.length){g.innerHTML='<div class="empty">'+(tab==='찜'?'아직 찜한 레퍼런스가 없어요. 카드의 ★를 눌러 보세요.':'조건에 맞는 레퍼런스가 없어요.')+'</div>';return}
 const top=tab==='정보 추천'?R.filter(r=>r.pick).sort((x,y)=>x.pick-y.pick).slice(0,3):[];const topH=top.length?'<div class="top3"><h3>💡 이번 주 윤우맘이 쓸만한 정보 TOP 3</h3>'+top.map(r=>'<div class="t3" onclick="window.open(\''+r.url+'\')"><b>'+r.pick+'</b><div><div class="t3a">'+(r.platform==='인스타'?'@':'')+esc(r.account)+' · '+fmt(r.views)+'회</div><div class="t3w">'+esc(r.why||'')+'</div><div class="t3f">👉 '+esc(r.fit||'')+'</div></div></div>').join('')+'</div>':'';
 g.innerHTML=(tab==='부업 검증'?sjTop():tab==='쿠팡 영상'?cpTop():topH)+a.map((r,i)=>{const hot=speed(r)>=100000;const hd=(dsel==='날짜별'&&(i===0||(a[i-1].found||'')!==(r.found||'')))?'<div class="dhead">📅 '+dLabel(r.found)+' 모은 것 · '+a.filter(x=>(x.found||'')===(r.found||'')).length+'개</div>':'';return hd+'<div class="card"><div class="th'+(r.platform==='유튜브'?' yt':'')+'" style="background-image:url('+r.img+')" onclick="openM(\''+r.id+'\')"><span class="rank">'+(i+1)+'</span><span class="views">'+fmt(r.views)+'<small> 회</small></span><button class="star'+(stars.has(r.id)?' on':'')+'" onclick="event.stopPropagation();tg(\''+r.id+'\')">★</button></div>'+
 '<div class="bd"><div class="tags"><span class="tag '+tcls[r.src]+'">'+r.src+'</span><span class="tag">'+r.platform+'</span>'+(r.cat?'<span class="tag">'+r.cat+'</span>':'')+(r.gtype?'<span class="tag">'+r.gtype+'</span>':'')+(hot?'<span class="tag hot">떡상중</span>':'')+(r.ratio>=3?'<span class="tag hot">'+(r.platform==='유튜브'?'구독자 ':'팔로워 ')+(r.ratio>=10?Math.round(r.ratio):r.ratio.toFixed(1))+'배</span>':'')+(ANALYSIS[r.id]?'<span class="tag o">분석완료</span>':'')+(r.funnel?'<span class="tag fun">강의 홍보</span>':'')+(stage[r.id]?'<span class="tag st">'+stName(stage[r.id])+'</span>':'')+'</div>'+
 (r.verdict?'<div class="vd '+VD[r.verdict][1]+'">'+VD[r.verdict][0]+'</div>':'')+sjCard(r)+'<div class="acc">'+(r.platform==='인스타'?'@':'')+esc(r.account)+'</div>'+(r.ctype?'<div class="cpk">'+({'완제품':'🛒 완제품 바로 링크','재료':'✂️ 재료·키트 링크','레시피':'🍳 레시피 + 도구 링크'}[r.ctype]||r.ctype)+'</div>':'')+((r.verdict||r.ctype)&&r.why?'<div class="why">'+esc(r.why)+'</div>':'')+((r.verdict||r.ctype)&&r.fit?'<div class="fit">👉 '+esc(r.fit)+'</div>':'')+'<div class="ttl">'+esc(first(r))+'</div>'+(r.product?'<div class="prod">'+esc(r.product)+'</div>':'')+
 '<div class="meta"><span>'+ago(r.posted)+' 게시</span>'+(r.platform==='유튜브'&&r.followers?'<span>구독자 '+fmt(r.followers)+'</span>':'')+(r.likes!=null?'<span>좋아요 '+fmt(r.likes)+'</span>':'')+(r.comments!=null?'<span>댓글 '+fmt(r.comments)+'</span>':'')+(r.duration?'<span>'+(r.duration>=120?Math.round(r.duration/60)+'분':r.duration+'초')+'</span>':'')+'</div>'+
 '<div class="btns"><a class="btn p" href="'+r.url+'" target="_blank">원본</a>'+(r.cpq?'<a class="btn cpb" href="'+cpUrl(r)+'" target="_blank" title="쿠팡 검색: '+esc(r.cpq)+'">쿠팡</a>':'')+'<button class="btn" onclick="'+(ANALYSIS[r.id]?'openM':'req')+'(\''+r.id+'\')">'+(ANALYSIS[r.id]?'분석 보기':'분석 요청')+'</button><button class="btn" onclick="setSt(\''+r.id+'\',\'todo\')">'+(stage[r.id]?'담김':'📋 담기')+'</button></div></div></div>'}).join('')}
function tg(id){stars.has(id)?stars.delete(id):stars.add(id);localStorage.setItem('refStars',JSON.stringify([...stars]));render()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}
function req(id){const r=R.find(x=>x.id===id);const t='레퍼런스 분석해줘: '+r.url;navigator.clipboard?.writeText(t).then(()=>toast('복사했어요. Aside 채팅에 붙여넣기만 하면 돼요'),()=>toast(t))}
function anHTML(an){if(!an)return '<b>아직 분석 전이에요.</b><br>"분석 요청"을 누르고 Aside 채팅에 붙여넣으면 1초 장면, 첫 3초 후킹, 대본 흐름, 댓글 반응, 윤우맘 버전 아이디어 5개를 여기에 채워 드려요.';
 if(!an.frames)return '<b>후킹 (0~3초)</b><br>'+esc(an.hook)+'<br><b>흐름</b><br>'+esc(an.flow)+'<br><b>마무리 유도</b><br>'+esc(an.cta)+'<br><b>우리 버전 아이디어</b><br>'+esc(an.ideas);
 const L=a=>(a||[]).map(x=>'<li>'+esc(x)+'</li>').join('');
 return '<div style="font-size:12px;color:#8a7f76">분석일 '+esc(an.date||'')+'</div>'+
 '<h5>🎞 1초 장면</h5><div class="frames">'+an.frames.map((f,i)=>'<div><img src="'+f+'" loading="lazy">'+i+'초</div>').join('')+'</div>'+
 '<h5>⚡ 첫 3초 후킹</h5>'+esc(an.hook)+
 '<h5>📝 대본 흐름</h5><ol>'+L(an.script)+'</ol>'+
 '<h5>🎥 화면 구성</h5>'+esc(an.screen||'')+
 (an.comments&&an.comments.length?'<h5>💬 댓글 반응</h5><ul>'+L(an.comments)+'</ul>'+(an.reaction?'<div>👉 '+esc(an.reaction)+'</div>':''):'')+
 '<h5>🔑 왜 터졌나</h5>'+esc(an.why||'')+
 '<h5>💡 윤우맘 버전 아이디어 5개</h5>'+(an.ideas||[]).map((x,i)=>'<div class="idea"><b>'+(i+1)+'. '+esc(x.title)+'</b><br>첫 1초: '+esc(x.hook)+'<br>흐름: '+esc(x.flow)+'</div>').join('')}
function openM(id){const r=R.find(x=>x.id===id),an=ANALYSIS[id];
 document.getElementById('box').className='box'+(an&&an.frames?' wide':'');
 document.getElementById('box').innerHTML='<div class="im" style="background-image:url('+r.img+')"></div><div class="tx"><div class="tags"><span class="tag '+tcls[r.src]+'">'+r.src+'</span><span class="tag">'+r.platform+'</span></div><h3>'+(r.platform==='인스타'?'@':'')+esc(r.account)+'</h3>'+
 '<div class="meta"><span>조회 '+fmt(r.views)+'</span>'+(r.likes!=null?'<span>좋아요 '+fmt(r.likes)+'</span>':'')+(r.comments!=null?'<span>댓글 '+fmt(r.comments)+'</span>':'')+'<span>'+(r.posted||'')+' 게시</span><span>하루 평균 '+fmt(Math.round(speed(r)))+'</span>'+(r.duration?'<span>'+(r.duration>=120?Math.round(r.duration/60)+'분':r.duration+'초')+'</span>':'')+(r.music?'<span>음원: '+esc(r.music)+'</span>':'')+'</div>'+
 (r.product?'<div class="prod">'+esc(r.product)+'</div>':'')+(r.ctype?'<div class="why">'+esc(r.why||'')+'</div><div class="fit">👉 '+esc(r.fit||'')+'</div><div class="btns"><a class="btn cpb" href="'+cpUrl(r)+'" target="_blank">쿠팡에서 "'+esc(r.cpq)+'" 찾기</a></div>':'')+(r.title?'<b>'+esc(r.title)+'</b>':'')+sjCard(r,true)+'<div class="cap">'+esc(r.caption)+'</div>'+
 '<div class="stg">'+STG.map(([k,nm])=>'<button class="'+(stage[id]===k?'on':'')+'" onclick="setSt(\''+id+'\',\''+k+'\')">'+nm+'</button>').join('')+'</div>'+
 '<div class="an">'+anHTML(an)+'</div>'+
 '<div class="btns"><a class="btn p" href="'+r.url+'" target="_blank">원본 보기</a><button class="btn" onclick="req(\''+r.id+'\')">분석 요청</button><button class="btn" onclick="tg(\''+r.id+'\');openM(\''+r.id+'\')">'+(stars.has(r.id)?'★ 찜 해제':'☆ 찜')+'</button></div></div>';
 document.getElementById('modal').classList.add('on')}
function closeM(){document.getElementById('modal').classList.remove('on')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};document.onkeydown=e=>{if(e.key==='Escape')closeM()};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{pf.has(c.dataset.pf)?pf.delete(c.dataset.pf):pf.add(c.dataset.pf);c.classList.toggle('on');render()});
document.getElementById('sort').onchange=render;document.getElementById('q').oninput=render;render();
</script>
</body></html>
