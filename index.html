.tag.sj{background:#e3f6e8;color:#1f7a3a}.tag.cn{background:#e0f2fe;color:#0369a1}.tag.ex{background:#fce7f3;color:#be185d}.tag.cp{background:#ffe9d6;color:#c2410c}.btn.cpb{background:#fff3e8;color:#c2410c;border-color:#f7c9a3}.cpk{font-size:12px;font-weight:800;color:#c2410c}.cpchips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.cpt .sub{font-size:12.5px;color:#8a6d3b;margin:-4px 0 8px;line-height:1.5}.tag.fun{background:#fde4e4;color:#b42323}

.play-toolbar{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}.play-toolbar p{margin:5px 0 0;color:var(--sub);font-size:13px}.play-board{grid-template-columns:repeat(5,minmax(0,1fr))}.play-card{grid-template-columns:48px minmax(0,1fr);gap:8px}.play-card .mt{width:48px;height:72px}.play-controls{margin-top:7px;display:flex;flex-direction:column;gap:7px}.play-controls label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:4px}.play-controls select{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;padding:7px 4px;background:#fff;color:var(--ink);font:inherit}.play-controls .mv{flex-wrap:wrap;gap:6px}.play-controls .mv button{flex:1 1 68px;min-height:32px;padding:5px 7px;word-break:keep-all}.play-controls .mv .play-done{background:#e3f6e8;color:#1f7a3a;border-color:#acd8b9;font-weight:700}.play-archive{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;background:#fff}.play-archive-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.play-archive-row:first-of-type{margin-top:10px}@media(max-width:1250px){.play-board{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.play-board{grid-template-columns:1fr}.play-toolbar{align-items:flex-start;flex-direction:column}}
</style><style>.hk-top .hk-fl{display:inline-block;vertical-align:top;width:calc(33% - 10px);margin-right:8px}.hk-top{background:#fff6ee;border-radius:16px;padding:16px 18px;margin-bottom:12px}.hk-top h3{margin:0 0 6px}.hk-sum{font-size:14px;color:#6b5a4a;margin-bottom:8px}.hk-fl{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}.hk-fl span{color:#998}.hk-fl ol{margin:6px 0 0 18px;padding:0}.hk-bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.hk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:10px}.hk{display:flex;gap:10px;background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}.hk-img{flex:0 0 78px;height:110px;border-radius:10px;background-size:cover;background-position:center;cursor:pointer}.hk-b{flex:1;min-width:0}.hk-t{font-weight:700;font-size:15px;margin:4px 0;line-height:1.4}.hk-ex{color:#c2410c;font-size:14px;margin:2px 0}.hk-m{font-size:12px;color:#888;margin-top:3px}.hk-f{font-size:12px;color:#555;margin-top:5px;line-height:1.45}.hk-mine{font-size:13px;color:#0f766e;margin-top:5px}.hk-a{font-size:12px;color:#c2410c}@media(max-width:700px){.hk-top .hk-fl{width:100%;display:block}.hk-list{grid-template-columns:1fr}}</style></head><body>
<header><div><h1>우브로 <span>레퍼런스</span> 스튜디오</h1><div class="upd" id="upd"></div></div></header>

<script>
const R=window.REFS||[];window.ANALYSIS=window.ANALYSIS||{};
const SRC=['전체','관심 계정','첫마디','국내 바이럴','해외 아이디어','공구 트렌드','떡상 조사','AI 유튜브','등불사연','보내준 레퍼런스','정보 추천','정보 카드뉴스','전문가 육아','부업 검증','쿠팡 영상','찜','보드','놀이보드','등불야담보드','인생연습보드','콩떡이','우브로보드','쇼핑블로그보드'];

let hgrp='전체',hcat='전체';

 let a=H.filter(h=>(hgrp==='전체'||h.grp===hgrp)&&(hcat==='전체'||h.cat===hcat)&&(!q||[h.tmpl,h.ex,h.first,h.account,h.cat,h.flow].join(' ').toLowerCase().includes(q)));

 const base=H.filter(h=>hgrp==='전체'||h.grp===hgrp);const cats={};base.forEach(h=>cats[h.cat]=(cats[h.cat]||0)+1);
 const GN={'전체':'전체','kid':'👶 육아·공구·살림 100만','other':'🌐 다른 분야 (itzyou 자료)','auto':'🆕 새로 찾은 것'};
 const fl=M.flows?Object.values(M.flows).slice(0,3).map(f=>'<div class="hk-fl"><b>'+esc(f.name)+'</b> <span>'+f.n+'개 · 평균 '+f.avgDur+'초 · 컷 '+f.avgCuts+'개</span><ol>'+f.tpl.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol></div>').join(''):'';
 g.innerHTML='<div style="grid-column:1/-1;width:100%"><div class="hk-top"><h3>🎣 조회수 100만 넘은 릴스의 첫마디 틀</h3><div class="hk-sum">평균 길이 <b>'+(M.avgDur||'-')+'초</b> (중간값 '+(M.medDur||'-')+'초) · 평균 컷 <b>'+(M.avgCuts||'-')+'개</b> · 100개 중 94개가 0~1초에 화면 글자 · <a href="'+(M.report||'#')+'" target="_blank">자세한 분석 보기</a></div>'+fl+'</div>'+
 '<div class="hk-bar">'+['전체','kid','other','auto'].filter(k=>k==='전체'||H.some(h=>h.grp===k)).map(k=>'<button class="dchip'+(hgrp===k?' on':'')+'" onclick="hgrp=\''+k+'\';hcat=\'전체\';render()">'+GN[k]+' '+(k==='전체'?H.length:H.filter(h=>h.grp===k).length)+'</button>').join('')+'</div>'+
 '<div class="hk-bar">'+['전체',...Object.keys(cats).sort((x,y)=>cats[y]-cats[x])].map(c=>'<button class="dchip'+(hcat===c?' on':'')+'" onclick="hcat=\''+c.replace(/'/g,'')+'\';render()">'+esc(c)+(c==='전체'?'':' '+cats[c])+'</button>').join('')+'</div>'+
 '<div class="hk-list">'+(a.length?a.map(h=>'<div class="hk">'+(h.img?'<div class="hk-img" style="background-image:url(\''+h.img+'\')" onclick="window.open(\''+h.url+'\')"></div>':'')+'<div class="hk-b"><div class="hk-tag"><span class="tag">'+esc(h.cat||'')+'</span>'+(h.grp==='auto'?'<span class="tag hot">새로 찾음 '+esc(h.added||'')+'</span>':'')+'</div><div class="hk-t">'+esc(h.tmpl||'')+'</div>'+(h.ex?'<div class="hk-ex">“'+esc(h.ex)+'”</div>':'')+(h.first&&h.first!==h.ex?'<div class="hk-m">첫 화면 글자: '+esc(h.first)+'</div>':'')+'<div class="hk-m">@'+esc(h.account||'')+(h.field?' · '+esc(h.field):'')+' · '+fmt(h.views)+'회'+(h.dur?' · '+Math.round(h.dur)+'초':'')+(h.cuts?' · 컷 '+h.cuts+'개':'')+'</div>'+(h.flow?'<div class="hk-f">🎬 '+esc(h.flow)+'</div>':'')+(h.mine?'<div class="hk-mine">👉 윤우맘 버전: '+esc(h.mine)+'</div>':'')+(h.url?'<a class="hk-a" href="'+h.url+'" target="_blank">원본 보기</a>':'')+'</div></div>').join(''):'<div class="empty">조건에 맞는 첫마디가 없어요.</div>')+'</div></div>'}
